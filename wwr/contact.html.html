<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact White Water Rafting Co. for questions, reservations, and customer support.">
    <meta name="author" content="Julie Nasser">
    <title>Contact Us | White Water Rafting Co.</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="White Water Rafting Co. logo" class="logo">

        <nav class="navigation" aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html" class="active" aria-current="page">Contact Us</a>
        </nav>
    </header>

    <main>

        <!-- CONTACT INFORMATION -->
        <section class="contact-info">
            <h2>Contact Information</h2>

            <p><strong>Address:</strong> 123 Main River Street, Kolob, California</p>
            <p><strong>Phone:</strong> +1 (555) 123‑4567</p>
            <p><strong>Email:</strong> info@raftingco.com</p>

            <!-- GOOGLE MAP -->
            <div class="map-container">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d340.56641665156997!2d-120.84586149821858!3d37.49453328252174!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8091064bb59463b7%3A0x1fd1a2752ddf9afb!2sMain%20Street%20Antiques!5e1!3m2!1sen!2sde!4v1791987585909!5m2!1sen!2sde" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin">
                </iframe>
            </div>
        </section>

        <!-- EMPLOYEE PROFILES -->
        <section class="employees">
            <h2>Meet Our Team</h2>

            <div class="employee-grid">
                <figure>
                    <img src="images/guide1.jpg" alt="Lead Guide">
                    <figcaption>Markus — Lead Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/guide2.jpg" alt="Safety Coordinator">
                    <figcaption>Sophia — Safety Coordinator</figcaption>
                </figure>

                <figure>
                    <img src="images/guide3.jpg" alt="Booking Manager">
                    <figcaption>Jonas — Booking Manager</figcaption>
                </figure>
            </div>
        </section>

        <!-- CONTACT FORM -->
        <section class="contact-form">
            <h2>Send Us a Message</h2>

            <form>

                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>

                <fieldset>
                    <legend>Purpose of Message</legend>

                    <label>
                        <input type="radio" name="purpose" value="general" required>
                        General Inquiry
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <label class="newsletter">
                    <input type="checkbox" name="newsletter">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Send Message</button>

            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 White Water Rafting Co. | Julie Nasser</p>

        <nav class="socialmedia" aria-label="Social media">
            <a href="https://www.facebook.com/" aria-label="Facebook">
                <img src="images/facebook.png" alt="">
            </a>

            <a href="https://www.instagram.com/" aria-label="Instagram">
                <img src="images/instagram.png" alt="">
            </a>

            <a href="https://www.twitter.com/" aria-label="Twitter">
                <img src="images/twitter.png" alt="">
            </a>
        </nav>
    </footer>
</body>

</html>
